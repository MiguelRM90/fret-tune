<div
  class="needle-gauge"
  [class.needle-gauge--in-tune]="isInTune()"
  [class.needle-gauge--active]="reading() !== null"
>
  <div class="gauge-arc">
    <div class="gauge-arc__glow"></div>
    <div class="gauge-scale">
      @for (tick of tickMarks; track tick) {
        <div
          class="gauge-tick"
          [class.gauge-tick--center]="tick === 0"
          [class.gauge-tick--major]="tick % 20 === 0"
          [style.transform]="'rotate(' + getTickAngle(tick) + 'deg)'"
        >
          <span class="gauge-tick__line"></span>
          @if (tick === -50 || tick === -20 || tick === 0 || tick === 20 || tick === 50) {
            <span class="gauge-tick__label" [style.transform]="'rotate(' + -getTickAngle(tick) + 'deg)'">
              {{ tick === 0 ? '0' : (tick > 0 ? '+' + tick : tick) }}
            </span>
          }
        </div>
      }
    </div>

    <!-- Center sweet-spot zone -->
    <div class="gauge-sweet-spot"></div>

    <!-- Indicator Needle -->
    <div
      class="gauge-needle"
      [style.transform]="'rotate(' + needleAngle() + 'deg)'"
    >
      <div class="gauge-needle__beam"></div>
      <div class="gauge-needle__tip"></div>
    </div>

    <!-- Pivot Hub -->
    <div class="gauge-pivot">
      <div class="gauge-pivot__inner"></div>
    </div>
  </div>

  <div class="gauge-status">
    <span class="gauge-status__flat" [class.gauge-status--active]="reading()?.direction === 'flat'">♭ Flat</span>
    <span class="gauge-status__center" [class.gauge-status--in-tune]="isInTune()">
      {{ isInTune() ? '● IN TUNE ●' : 'PERFECT PITCH' }}
    </span>
    <span class="gauge-status__sharp" [class.gauge-status--active]="reading()?.direction === 'sharp'">Sharp ♯</span>
  </div>
</div>
